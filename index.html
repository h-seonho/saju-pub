<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 사주 풀이 서비스</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --header-text: #f1f5f9;
            --label-color: #cbd5e1;
            --input-bg: #0f172a;
            --input-border: #475569;
            --input-text: #ffffff;
            --result-border: #475569;
            --cell-bg: #0f172a;
            --cell-border: #334155;
            --cell-label: #94a3b8;
            --cell-value: #f1f5f9;
            --inter-bg: #0f172a;
            --inter-text: #e2e8f0;
        }

        body.light-mode {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --text-color: #1e293b;
            --header-text: #0f172a;
            --label-color: #475569;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-text: #0f172a;
            --result-border: #cbd5e1;
            --cell-bg: #f1f5f9;
            --cell-border: #e2e8f0;
            --cell-label: #64748b;
            --cell-value: #0f172a;
            --inter-bg: #f1f5f9;
            --inter-text: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--container-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--result-border);
            transition: background-color 0.3s;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--input-border);
            color: var(--text-color);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--header-text);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--label-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--label-color);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--input-text);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
        }

        .radio-group label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* 결과 화면 디자인 */
        .result-box {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px dashed var(--result-border);
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #60a5fa;
            text-align: center;
            margin-bottom: 15px;
        }

        .saju-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .saju-cell {
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            padding: 10px 4px;
            border-radius: 8px;
        }

        .saju-cell .label {
            font-size: 0.75rem;
            color: var(--cell-label);
            margin-bottom: 4px;
        }

        .saju-cell .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--cell-value);
        }

        .interpretation {
            background: var(--inter-bg);
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--inter-text);
        }

        .interpretation h4 {
            color: #38bdf8;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">다크모드</button>
        <h1>🔮 AI 정통 사주 풀이</h1>
        <p>생년월일시를 입력하면 타고난 운명과 사주 명식을 분석해 드립니다.</p>
    </div>

    <form id="sajuForm">
        <div class="form-group">
            <label>이름</label>
            <input type="text" id="userName" placeholder="이름을 입력하세요" required>
        </div>

        <div class="form-group">
            <label>성별</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="남성" checked> 남성</label>
                <label><input type="radio" name="gender" value="여성"> 여성</label>
            </div>
        </div>

        <div class="form-group">
            <label>생년월일</label>
            <input type="date" id="birthDate" required>
        </div>

        <div class="form-group">
            <label>양력 / 음력</label>
            <div class="radio-group">
                <label><input type="radio" name="calendar" value="양력" checked> 양력</label>
                <label><input type="radio" name="calendar" value="음력"> 음력</label>
            </div>
        </div>

        <div class="form-group">
            <label>태어난 시간</label>
            <select id="birthTime">
                <option value="모름">태어난 시간 모름</option>
                <option value="자시">자시 (23:30 ~ 01:29)</option>
                <option value="축시">축시 (01:30 ~ 03:29)</option>
                <option value="인시">인시 (03:30 ~ 05:29)</option>
                <option value="묘시">묘시 (05:30 ~ 07:29)</option>
                <option value="진시">진시 (07:30 ~ 09:29)</option>
                <option value="사시">사시 (09:30 ~ 11:29)</option>
                <option value="오시">오시 (11:30 ~ 13:29)</option>
                <option value="미시">미시 (13:30 ~ 15:29)</option>
                <option value="신시">신시 (15:30 ~ 17:29)</option>
                <option value="유시">유시 (17:30 ~ 19:29)</option>
                <option value="술시">술시 (19:30 ~ 21:29)</option>
                <option value="해시">해시 (21:30 ~ 23:29)</option>
            </select>
        </div>

        <button type="button" class="submit-btn" onclick="analyzeSaju()">사주 풀이 보기</button>
    </form>

    <!-- 사주 결과 출력 영역 -->
    <div class="result-box" id="resultBox">
        <div class="result-title" id="resultTitle">사주 분석 결과</div>
        
        <!-- 사주팔자 4주 테이블 -->
        <div class="saju-grid">
            <div class="saju-cell">
                <div class="label">시주 (時柱)</div>
                <div class="value" id="hourPillar">-</div>
            </div>
            <div class="saju-cell">
                <div class="label">일주 (日柱)</div>
                <div class="value" id="dayPillar">-</div>
            </div>
            <div class="saju-cell">
                <div class="label">월주 (月柱)</div>
                <div class="value" id="monthPillar">-</div>
            </div>
            <div class="saju-cell">
                <div class="label">년주 (年柱)</div>
                <div class="value" id="yearPillar">-</div>
            </div>
        </div>

        <!-- 풀이 텍스트 영역 -->
        <div class="interpretation">
            <h4>📜 종합 사주 총평</h4>
            <p id="analysisText">입력하신 정보 기반으로 사주를 분석 중입니다...</p>
        </div>
    </div>
</div>

<script>
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const btn = document.getElementById('themeToggle');
        if (document.body.classList.contains('light-mode')) {
            btn.innerText = '다크모드';
        } else {
            btn.innerText = '화이트모드';
        }
    }
    // 정확한 간지 계산을 위한 데이터 및 함수
    const heavenlyStems = ["갑(甲)", "을(乙)", "병(丙)", "정(丁)", "무(戊)", "기(己)", "경(庚)", "신(辛)", "임(壬)", "계(癸)"];
    const earthlyBranches = ["자(子)", "축(丑)", "인(寅)", "묘(卯)", "진(辰)", "사(巳)", "오(午)", "미(未)", "신(申)", "유(酉)", "술(戌)", "해(亥)"];

    // 1900년 1월 1일은 갑자(甲子)일 (index 0)
    const referenceDate = new Date(1900, 0, 1);

    function getGanJi(daysOffset) {
        // 음수일 경우를 대비한 나머지 연산 보정
        const stemIdx = ((daysOffset % 10) + 10) % 10;
        const branchIdx = ((daysOffset % 12) + 12) % 12;
        return {
            stem: heavenlyStems[stemIdx],
            branch: earthlyBranches[branchIdx]
        };
    }

    const sajuDatabase = {
        "갑자": {
            "종합 사주 총평": "갑자(甲子)일주는 타고난 리더십과 지혜를 갖추고 있습니다. 시작하는 힘이 강하며 새로운 것을 개척하는 능력이 탁월합니다.",
            "초년운": "학업에 대한 열망이 높고 일찍부터 자신의 재능을 인정받는 시기입니다.",
            "중년운": "본격적인 사회활동을 통해 큰 성과를 거두며 재물이 쌓이는 시기입니다.",
            "말년운": "안정적인 기반 위에서 주변의 존경을 받으며 편안하게 지내는 운입니다.",
            "건강운": "활동적이라 체력은 좋으나 과로를 주의해야 합니다.",
            "연애운": "감정 표현이 솔직하여 진실된 만남을 이어갑니다.",
            "결혼운": "서로의 비전을 존중하는 파트너와 인연이 깊습니다.",
            "어떤 사람이랑 결혼을 해야하는지": "나의 추진력을 보완해 줄 차분하고 이해심 많은 사람.",
            "재물운": "지혜로운 투자로 재산을 증식하는 능력이 있습니다.",
            "재물모으는법": "한 번에 큰 것보다 적립식 투자가 좋습니다.",
            "체질운": "수(水) 기운이 강하니 냉증을 조심하세요.",
            "사회운": "조직 내에서 핵심 인재로 성장합니다.",
            "성격운": "솔직하고 당당하며 의리가 있습니다."
        },
        "default": {
            "종합 사주 총평": "타고난 기운에 따라 조화로운 삶을 추구하는 것이 중요합니다.",
            "초년운": "순수한 호기심으로 다양한 경험을 쌓는 시기입니다.",
            "중년운": "자신의 목표를 향해 정진하며 안정적인 성과를 만듭니다.",
            "말년운": "성취한 결과를 바탕으로 주변과 나누며 행복을 찾습니다.",
            "건강운": "규칙적인 식습관과 가벼운 운동이 필요합니다.",
            "연애운": "소소한 대화와 교감을 통해 깊은 정을 나눕니다.",
            "결혼운": "상호 신뢰를 바탕으로 가정을 꾸립니다.",
            "어떤 사람이랑 결혼을 해야하는지": "가치관이 비슷하고 대화가 잘 통하는 사람.",
            "재물운": "성실함이 최고의 재물 창출 비결입니다.",
            "재물모으는법": "작은 것부터 아껴 쓰는 습관이 중요합니다.",
            "체질운": "균형 잡힌 식단으로 면역력을 관리하세요.",
            "사회운": "원만한 인간관계를 유지하며 신뢰를 쌓습니다.",
            "성격운": "부드러움 속에 강한 인내심을 품고 있습니다."
        }
    };

    function generateAnalysis(name, dayGanJi) {
        const sections = [
            "종합 사주 총평", "초년운", "중년운", "말년운", "건강운", "연애운", "결혼운", 
            "어떤 사람이랑 결혼을 해야하는지", "재물운", "재물모으는법", "체질운", "사회운", "성격운"
        ];

        // 일주 문자열 추출 (예: "갑(甲)" -> "갑")
        const stem = dayGanJi.stem.charAt(0);
        const branch = dayGanJi.branch.charAt(0);
        const key = stem + branch;

        const data = sajuDatabase[key] || sajuDatabase["default"];

        let html = "";
        sections.forEach(title => {
            const content = data[title] || "해당 섹션에 대한 상세 데이터가 준비 중입니다.";

            html += `
                <div style="margin-bottom: 25px;">
                    <h4 style="color: #38bdf8; margin-bottom: 10px;">📜 ${title}</h4>
                    <p style="color: var(--inter-text); line-height: 1.8; font-size: 0.95rem;">${content}</p>
                </div>
            `;
        });
        return html;
    }

    function analyzeSaju() {
        const name = document.getElementById('userName').value;
        const birthDate = document.getElementById('birthDate').value;
        const time = document.getElementById('birthTime').value;

        if (!name || !birthDate) {
            alert("이름과 생년월일을 모두 입력해 주세요!");
            return;
        }

        const dateObj = new Date(birthDate);

        const diffTime = dateObj - referenceDate;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        const dayGanJi = getGanJi(diffDays);

        const year = dateObj.getFullYear();
        const yearGanJi = getGanJi(year - 1900 + 0); 
        const monthGanJi = getGanJi(dateObj.getMonth()); 

        document.getElementById('yearPillar').innerText = `${yearGanJi.stem}\n${yearGanJi.branch}`;
        document.getElementById('monthPillar').innerText = `${monthGanJi.stem}\n${monthGanJi.branch}`;
        document.getElementById('dayPillar').innerText = `${dayGanJi.stem}\n${dayGanJi.branch}`;
        document.getElementById('hourPillar').innerText = time !== "모름" ? `${time}` : "미상";

        document.getElementById('resultTitle').innerText = `${name} 님의 사주 풀이`;

        document.getElementById('analysisText').innerHTML = generateAnalysis(name, dayGanJi);

        document.getElementById('resultBox').style.display = 'block';
    }

</script>

</body>
</html>
