<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 사주 풀이 서비스</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --header-text: #f1f5f9;
            --label-color: #cbd5e1;
            --input-bg: #0f172a;
            --input-border: #475569;
            --input-text: #ffffff;
            --result-border: #475569;
            --cell-bg: #0f172a;
            --cell-border: #334155;
            --cell-label: #94a3b8;
            --cell-value: #f1f5f9;
            --inter-bg: #0f172a;
            --inter-text: #e2e8f0;
        }

        body.light-mode {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --text-color: #1e293b;
            --header-text: #0f172a;
            --label-color: #475569;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-text: #0f172a;
            --result-border: #cbd5e1;
            --cell-bg: #f1f5f9;
            --cell-border: #e2e8f0;
            --cell-label: #64748b;
            --cell-value: #0f172a;
            --inter-bg: #f1f5f9;
            --inter-text: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--container-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--result-border);
            transition: background-color 0.3s;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--input-border);
            color: var(--text-color);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--header-text);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--label-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--label-color);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--input-text);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
        }

        .radio-group label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* 결과 화면 디자인 */
        .result-box {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px dashed var(--result-border);
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #60a5fa;
            text-align: center;
            margin-bottom: 15px;
        }

        .saju-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .saju-cell {
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            padding: 10px 4px;
            border-radius: 8px;
        }

        .saju-cell .label {
            font-size: 0.75rem;
            color: var(--cell-label);
            margin-bottom: 4px;
        }

        .saju-cell .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--cell-value);
        }

        .interpretation {
            background: var(--inter-bg);
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--inter-text);
        }

        .interpretation h4 {
            color: #38bdf8;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="theme-toggle" onclick="toggleTheme()">테마 변경</button>
        <h1>🔮 AI 정통 사주 풀이</h1>
        <p>생년월일시를 입력하면 타고난 운명과 사주 명식을 분석해 드립니다.</p>
    </div>

    <form id="sajuForm">
        <div class="form-group">
            <label>이름</label>
            <input type="text" id="userName" placeholder="이름을 입력하세요" required>
        </div>

        <div class="form-group">
            <label>성별</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="남성" checked> 남성</label>
                <label><input type="radio" name="gender" value="여성"> 여성</label>
            </div>
        </div>

        <div class="form-group">
            <label>생년월일</label>
            <input type="date" id="birthDate" required>
        </div>

        <div class="form-group">
            <label>양력 / 음력</label>
            <div class="radio-group">
                <label><input type="radio" name="calendar" value="양력" checked> 양력</label>
                <label><input type="radio" name="calendar" value="음력"> 음력</label>
            </div>
        </div>

        <div class="form-group">
            <label>태어난 시간</label>
            <select id="birthTime">
                <option value="모름">태어난 시간 모름</option>
                <option value="자시">자시 (23:30 ~ 01:29)</option>
                <option value="축시">축시 (01:30 ~ 03:29)</option>
                <option value="인시">인시 (03:30 ~ 05:29)</option>
                <option value="묘시">묘시 (05:30 ~ 07:29)</option>
                <option value="진시">진시 (07:30 ~ 09:29)</option>
                <option value="사시">사시 (09:30 ~ 11:29)</option>
                <option value="오시">오시 (11:30 ~ 13:29)</option>
                <option value="미시">미시 (13:30 ~ 15:29)</option>
                <option value="신시">신시 (15:30 ~ 17:29)</option>
                <option value="유시">유시 (17:30 ~ 19:29)</option>
                <option value="술시">술시 (19:30 ~ 21:29)</option>
                <option value="해시">해시 (21:30 ~ 23:29)</option>
            </select>
        </div>

        <button type="button" class="submit-btn" onclick="analyzeSaju()">사주 풀이 보기</button>
    </form>

    <!-- 사주 결과 출력 영역 -->
    <div class="result-box" id="resultBox">
        <div class="result-title" id="resultTitle">사주 분석 결과</div>
        
        <!-- 사주팔자 4주 테이블 -->
        <div class="saju-grid">
            <div class="saju-cell">
                <div class="label">시주 (時柱)</div>
                <div class="value" id="hourPillar">-</div>
            </div>
            <div class="saju-cell">
                <div class="label">일주 (日柱)</div>
                <div class="value" id="dayPillar">-</div>
            </div>
            <div class="saju-cell">
                <div class="label">월주 (月柱)</div>
                <div class="value" id="monthPillar">-</div>
            </div>
            <div class="saju-cell">
                <div class="label">년주 (年柱)</div>
                <div class="value" id="yearPillar">-</div>
            </div>
        </div>

        <!-- 풀이 텍스트 영역 -->
        <div class="interpretation">
            <h4>📜 종합 사주 총평</h4>
            <p id="analysisText">입력하신 정보 기반으로 사주를 분석 중입니다...</p>
        </div>
    </div>
</div>

<script>
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
    }

    // 간이 천간/지자 데이터 (예시 계산용)

    const heavenlyStems = ["갑(甲)", "을(乙)", "병(丙)", "정(丁)", "무(戊)", "기(己)", "경(庚)", "신(辛)", "임(壬)", "계(癸)"];
    const earthlyBranches = ["자(子)", "축(丑)", "인(寅)", "묘(卯)", "진(辰)", "사(巳)", "오(午)", "미(未)", "신(申)", "유(酉)", "술(戌)", "해(亥)"];

    function analyzeSaju() {
        const name = document.getElementById('userName').value;
        const birthDate = document.getElementById('birthDate').value;
        const time = document.getElementById('birthTime').value;

        if (!name || !birthDate) {
            alert("이름과 생년월일을 모두 입력해 주세요!");
            return;
        }

        const dateObj = new Date(birthDate);
        const year = dateObj.getFullYear();
        const month = dateObj.getMonth() + 1;
        const day = dateObj.getDate();

        // 4주(시/일/월/년) 기본 조합 계산 알고리즘 (간이 구현 예시)
        const yearStem = heavenlyStems[(year - 4) % 10];
        const yearBranch = earthlyBranches[(year - 4) % 12];
        
        const monthStem = heavenlyStems[(month + 2) % 10];
        const monthBranch = earthlyBranches[(month + 1) % 12];

        const dayStem = heavenlyStems[(day + 5) % 10];
        const dayBranch = earthlyBranches[(day + 3) % 12];

        // 결과 화면 표시
        document.getElementById('yearPillar').innerText = `${yearStem}\n${yearBranch}`;
        document.getElementById('monthPillar').innerText = `${monthStem}\n${monthBranch}`;
        document.getElementById('dayPillar').innerText = `${dayStem}\n${dayBranch}`;
        document.getElementById('hourPillar').innerText = time !== "모름" ? `${time}` : "미상";

        document.getElementById('resultTitle').innerText = `${name} 님의 사주 풀이`;
        
        // 사주 해석 텍스트 생성
        document.getElementById('analysisText').innerHTML = `
            <strong>${name}</strong> 님은 타고난 기운에 <b>${dayStem}</b>의 형상을 품고 있습니다.<br><br>
            • <b>성격 및 성향:</b> 리더십이 뛰어나고 책임감이 강하며, 한 번 결심한 목표는 꾸준히 밀고 나가는 추진력이 있습니다.<br>
            • <b>재물운:</b> 초년보다 중년 이후로 재물이 쌓이는 대기만성형 형태입니다.<br>
            • <b>조언:</b> 주변 사람들과의 원만한 조화를 신경 쓰면 더욱 큰 성과를 거둘 수 있습니다.
        `;

        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
