<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 사주 풀이 서비스</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --header-text: #f1f5f9;
            --label-color: #cbd5e1;
            --input-bg: #0f172a;
            --input-border: #475569;
            --input-text: #ffffff;
            --result-border: #475569;
            --cell-bg: #0f172a;
            --cell-border: #334155;
            --cell-label: #94a3b8;
            --cell-value: #f1f5f9;
            --inter-bg: #0f172a;
            --inter-text: #e2e8f0;
        }

        body.light-mode {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --text-color: #1e293b;
            --header-text: #0f172a;
            --label-color: #475569;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-text: #0f172a;
            --result-border: #cbd5e1;
            --cell-bg: #f1f5f9;
            --cell-border: #e2e8f0;
            --cell-label: #64748b;
            --cell-value: #0f172a;
            --inter-bg: #f1f5f9;
            --inter-text: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--container-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--result-border);
            transition: background-color 0.3s;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--input-border);
            color: var(--text-color);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--header-text);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--label-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--label-color);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--input-text);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
        }

        .radio-group label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* 로딩 스피너 디자인 */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 카드 UI 디자인 */
        .analysis-card {
            background: var(--container-bg);
            border: 1px solid var(--result-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .analysis-title {
            color: #38bdf8;
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #60a5fa;
            text-align: center;
            margin-bottom: 15px;
        }

        .saju-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .saju-cell {
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            padding: 10px 4px;
            border-radius: 8px;
        }

        .saju-cell .label {
            font-size: 0.75rem;
            color: var(--cell-label);
            margin-bottom: 4px;
        }

        .saju-cell .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--cell-value);
        }

        .interpretation {
            background: var(--inter-bg);
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--inter-text);
        }

        .interpretation h4 {
            color: #38bdf8;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">다크모드</button>
        <h1>🔮 AI 정통 사주 풀이</h1>
        <p>생년월일시를 입력하면 타고난 운명과 사주 명식을 분석해 드립니다.</p>
    </div>

    <form id="sajuForm">
        <div class="form-group">
            <label>이름</label>
            <input type="text" id="userName" placeholder="이름을 입력하세요" required>
        </div>

        <div class="form-group">
            <label>성별</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="남성" checked> 남성</label>
                <label><input type="radio" name="gender" value="여성"> 여성</label>
            </div>
        </div>

        <div class="form-group">
            <label>생년월일</label>
            <input type="date" id="birthDate" min="1900-01-01" max="2100-12-31" required>
        </div>

        <div class="form-group">
            <label>양력 / 음력</label>
            <div class="radio-group">
                <label><input type="radio" name="calendar" value="양력" checked> 양력</label>
                <label><input type="radio" name="calendar" value="음력"> 음력</label>
            </div>
        </div>

        <div class="form-group">
            <label>태어난 시간</label>
            <select id="birthTime">
                <option value="모름">태어난 시간 모름</option>
                <option value="자시">자시 (23:30 ~ 01:29)</option>
                <option value="축시">축시 (01:30 ~ 03:29)</option>
                <option value="인시">인시 (03:30 ~ 05:29)</option>
                <option value="묘시">묘시 (05:30 ~ 07:29)</option>
                <option value="진시">진시 (07:30 ~ 09:29)</option>
                <option value="사시">사시 (09:30 ~ 11:29)</option>
                <option value="오시">오시 (11:30 ~ 13:29)</option>
                <option value="미시">미시 (13:30 ~ 15:29)</option>
                <option value="신시">신시 (15:30 ~ 17:29)</option>
                <option value="유시">유시 (17:30 ~ 19:29)</option>
                <option value="술시">술시 (19:30 ~ 21:29)</option>
                <option value="해시">해시 (21:30 ~ 23:29)</option>
            </select>
        </div>

        <button type="button" class="submit-btn" onclick="analyzeSaju()">사주 풀이 보기</button>
    </form>

    <!-- 사주 결과 출력 영역 -->
    <div class="result-box" id="resultBox" style="margin-top: 80px;">
        <div class="result-title" id="resultTitle" style="margin-bottom: 30px;">사주 분석 결과</div>
        
        <!-- 사주팔자 4주 테이블 -->
        <div class="saju-grid">
            <div class="saju-cell">
                <div class="label">시주 (時柱)</div>
                <div class="value" id="hourPillar">-</div>
            </div>
            <div class="saju-cell">
                <div class="label">일주 (日柱)</div>
                <div class="value" id="dayPillar">-</div>
            </div>
            <div class="saju-cell">
                <div class="label">월주 (月柱)</div>
                <div class="value" id="monthPillar">-</div>
            </div>
            <div class="saju-cell">
                <div class="label">년주 (年柱)</div>
                <div class="value" id="yearPillar">-</div>
            </div>
        </div>

        <!-- 풀이 텍스트 영역 -->
        <div class="interpretation">
            <h4>📜 종합 사주 총평</h4>
            <p id="analysisText">입력하신 정보 기반으로 사주를 분석 중입니다...</p>
        </div>
    </div>
</div>

<script>
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const btn = document.getElementById('themeToggle');
        if (document.body.classList.contains('light-mode')) {
            btn.innerText = '다크모드';
        } else {
            btn.innerText = '화이트모드';
        }
    }
    async function analyzeSaju() {
        const name = document.getElementById('userName').value;
        const birthDate = document.getElementById('birthDate').value;
        const time = document.getElementById('birthTime').value;

        if (!name || !birthDate) {
            alert("이름과 생년월일을 모두 입력해 주세요!");
            return;
        }

        // 결과 박스 로딩 표시
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('analysisText').innerHTML = `
            <div class="spinner"></div>
            <p style="text-align: center; color: var(--text-color);">AI가 정통 명리학으로 사주를 분석 중입니다...</p>
        `;

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, birthDate, time })
            });
            
            const data = await response.json();
            
            // AI 응답을 카드 UI로 감싸기 (간단한 파싱)
            let rawContent = data.analysis.replace(/```html/g, '').replace(/```/g, '');
            
            // 섹션별 아이콘 매핑
            const iconMap = {
                "종합 사주 총평": "🔮", "초년운 및 성장기": "🌱", "중년운 (사회적 성취)": "🌳", "말년운 (재물과 안식)": "🍂", 
                "건강 및 체질 조언": "💪", "연애운": "❤️", "결혼운": "💍", "직장 및 사업운 (재물 모으는 비법 포함)": "💼", "재물": "💰"
            };

            // h4 제목을 카드 UI로 변환
            let formattedContent = rawContent.replace(/<h4>(.*?)<\/h4>/g, (match, title) => {
                const icon = iconMap[title] || "💡";
                return `<div class="analysis-card"><div class="analysis-title"><span>${icon}</span>${title}</div>`;
            }).replace(/<\/p>/g, '</p></div>');
            
            document.getElementById('analysisText').innerHTML = formattedContent;
            
            // Pillar 정보 표시
            document.getElementById('yearPillar').innerText = data.sajuPillar.year;
            document.getElementById('monthPillar').innerText = data.sajuPillar.month;
            document.getElementById('dayPillar').innerText = data.sajuPillar.day;
            document.getElementById('hourPillar').innerText = data.sajuPillar.time;

        } catch (error) {
            document.getElementById('analysisText').innerHTML = "분석 중 오류가 발생했습니다. 다시 시도해 주세요.";
        }
    }

    // 페이지 로드 시 결과창 강제 숨김
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('resultBox').style.display = 'none';
    });

</script>

</body>
</html>
